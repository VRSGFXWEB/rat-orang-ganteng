name: Extract ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - 'noir-parental-control.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract noir-parental-control.zip
        run: unzip -o noir-parental-control.zip -d .

      - name: Commit hasil extract
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add noir-parental/
          git commit -m "Extract noir-parental-control.zip" || echo "Tidak ada perubahan"
          git push
