name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Arahkan ke folder proyek Android yang sebenarnya
    defaults:
      run:
        working-directory: noir-parental/child-app-android

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: child-app-debug-apk
        # Path ini relatif dari root repo, bukan dari working-directory
        path: noir-parental/child-app-android/app/build/outputs/apk/debug/app-debug.apk
