name: Build APK Paling Anti Gagal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true

    # --- 1. BIKIN FOLDER PROYEK BARU DARI NOL ---
    - name: Bikin Proyek Dari Nol
      run: |
        mkdir -p proyek-baru/app/src/main/java/com/example/myapp
        mkdir -p proyek-baru/app/src/main/res/layout
        cd proyek-baru
        
        # Bikin settings.gradle
        cat <<EOF > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = 'MyApp'
        include ':app'
        EOF

        # Bikin build.gradle root
        echo "// Root build.gradle" > build.gradle

        # Bikin build.gradle app
        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application' version '8.6.1'
        }
        android {
            namespace 'com.example.myapp'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.myapp"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        # Bikin AndroidManifest.xml
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="MyApp">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Bikin MainActivity.kt (Kode Kotlin)
        cat <<EOF > app/src/main/java/com/example/myapp/MainActivity.kt
        package com.example.myapp
        import android.os.Bundle
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val textView = TextView(this)
                textView.text = "HALO BANG! APK INI BERHASIL DIBUAT!"
                setContentView(textView)
            }
        }
        EOF

        # Bikin Layout XML
        cat <<EOF > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:gravity="center">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="HALO BANG!" />
        </LinearLayout>
        EOF

        # Bikin Gradle Wrapper
        gradle wrapper

    # --- 2. BUILD ---
    - name: Build APK
      run: |
        cd proyek-baru
        ./gradlew assembleDebug

    # --- 3. TARIK & UPLOAD ---
    - name: Tarik APK
      run: |
        find . -name "*.apk"
        find . -name "*.apk" -exec cp {} ./HASIL_APK.apk \;

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK-JADI
        path: HASIL_APK.apk
