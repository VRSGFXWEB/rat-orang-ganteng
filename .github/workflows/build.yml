name: Build APK Asli (Cek Error)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # --- 1. SETUP FOLDER PROYEK ---
    - name: Setup Gradle Wrapper & Settings
      run: |
        cd noir-parental/child-app-android
        
        # Bikin wrapper kalau belum ada
        if [ ! -f gradlew ]; then gradle wrapper; fi
        chmod +x gradlew

        # Bikin settings.gradle yang bener
        cat <<EOF > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = 'ChildApp'
        include ':app'
        EOF

    # --- 2. FIX PLUGIN KALAU BELUM ADA VERSINYA ---
    - name: Fix build.gradle
      run: |
        cd noir-parental/child-app-android
        
        # Tambahin versi plugin kalau belum ada
        if ! grep -q "version '8.6.1'" app/build.gradle; then
          sed -i "s/id 'com.android.application'/id 'com.android.application' version '8.6.1'/" app/build.gradle
        fi

    # --- 3. BUILD (PAKAI --STACKTRACE BIAR ERRORNYA JELAS) ---
    - name: Build Debug APK
      run: |
        cd noir-parental/child-app-android
        # Pakai --stacktrace biar kalau gagal, errornya kelihatan
        ./gradlew assembleDebug --stacktrace

    # --- 4. CEK FOLDER OUTPUT ---
    - name: Cek Folder Output
      run: |
        echo "=== ISI FOLDER BUILD ==="
        ls -R noir-parental/child-app-android/app/build/ || echo "FOLDER BUILD NGGAK ADA (Berarti Build Gagal!)"
        
        echo "=== CARI FILE APK ==="
        find . -name "*.apk"

    # --- 5. TARIK & UPLOAD ---
    - name: Tarik APK ke Root
      run: |
        find . -name "*.apk" -exec cp {} ./HASIL_APK.apk \;
        ls -la HASIL_APK.apk || echo "NGGAK ADA APK YANG DITARIK"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK-ASLI-KAMU
        path: HASIL_APK.apk
