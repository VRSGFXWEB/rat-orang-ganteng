name: Build APK Final

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: noir-parental/child-app-android

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Generate Gradle Wrapper & Settings
      run: |
        gradle wrapper
        echo "rootProject.name = 'ChildApp'" > settings.gradle
        echo "include ':app'" >> settings.gradle

    # --- BERSIHKAN FILE LAMA YANG BIKIN BENTROK ---
    - name: Hapus build.gradle lama & bikin yang baru
      run: |
        # Hapus file build.gradle di luar folder app (kalau ada)
        rm -f build.gradle
        
        # Bikin folder app & build.gradle yang baru
        mkdir -p app
        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.noir.childapp'
            compileSdk 34

            defaultConfig {
                applicationId "com.noir.childapp"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }

        dependencies {
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Tulis ulang AndroidManifest & Layout
      run: |
        mkdir -p app/src/main
        mkdir -p app/src/main/res/layout

        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application>
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat <<EOF > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:gravity="center">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Aplikasi Berhasil Di-build!" />
        </LinearLayout>
        EOF

    # --- BUILD ---
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # --- CEK APAKAH FILE NYA BENERAN ADA ---
    - name: List file APK
      run: find . -name "*.apk"

    # --- UPLOAD ---
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: child-app-apk
        path: "**/*.apk"
