name: Build APK Fix Total

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: noir-parental/child-app-android

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Generate Gradle Wrapper & Settings
      run: |
        gradle wrapper --gradle-version 9.8.2
        cat <<EOF > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = 'ChildApp'
        include ':app'
        EOF

    - name: Bikin build.gradle
      run: |
        rm -f build.gradle
        mkdir -p app
        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application' version '8.6.1'
        }
        android {
            namespace 'com.noir.childapp'
            compileSdk 34
            defaultConfig {
                applicationId "com.noir.childapp"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Bikin Manifest & Layout
      run: |
        mkdir -p app/src/main/res/layout
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application>
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat <<EOF > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:gravity="center">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Aplikasi Berhasil Di-build!" />
        </LinearLayout>
        EOF

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # --- INI TRIK NYA: PINDAHIN APK KE ROOT ---
    - name: Pindahin APK ke Root
      run: |
        # Cari file apk, lalu copy ke folder utama repo
        find . -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/AppFinal.apk \;
        # Cek apakah file nya udah pindah
        ls -la $GITHUB_WORKSPACE/AppFinal.apk

    # --- UPLOAD DARI ROOT ---
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FINAL-APK-DOWNLOAD-DISINI
        path: AppFinal.apk
