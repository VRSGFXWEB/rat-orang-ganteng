
name: Final Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: noir-parental/child-app-android

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # --- 1. RAKIT STRUKTUR & FILE YANG HILANG ---
    - name: Generate Gradle Wrapper & Settings
      run: |
        gradle wrapper
        echo "rootProject.name = 'ChildApp'" > settings.gradle
        echo "include ':app'" >> settings.gradle

    - name: Bikin build.gradle yang benar (Plus Material)
      run: |
        mkdir -p app
        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.noir.childapp'
            compileSdk 34

            defaultConfig {
                applicationId "com.noir.childapp"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            
            buildFeatures {
                viewBinding true
            }
        }

        dependencies {
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Bikin AndroidManifest.xml minimal
      run: |
        mkdir -p app/src/main
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Child App" />
        </manifest>
        EOF

    # --- 2. SIHIR: GANTI 'auto:' JADI 'android:' ---
    - name: Fix XML Prefix (auto to android)
      run: |
        # Mencari semua file .xml di folder res dan mengganti auto: menjadi android:
        find app/src/main/res -name "*.xml" -exec sed -i 's/auto:/android:/g' {} +

    # --- 3. PROSES BUILD ---
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # --- 4. UPLOAD HASIL ---
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: child-app-final-apk
        path: noir-parental/child-app-android/app/build/outputs/apk/debug/app-debug.apk
