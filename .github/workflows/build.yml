name: Build APK Anti Gagal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # --- 1. BUNUH FILE PENGGANGGU ---
    - name: Setup Proyek
      run: |
        cd noir-parental/child-app-android
        
        # RENAME file build.gradle di luar folder app (biar diabaikan Gradle)
        if [ -f build.gradle ]; then mv build.gradle build.gradle.old; fi
        
        # Hapus folder build lama kalau ada
        rm -rf build .gradle

        # Bikin wrapper
        if [ ! -f gradlew ]; then gradle wrapper; fi
        chmod +x gradlew

        # Bikin settings.gradle yang bener
        cat <<EOF > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = 'ChildApp'
        include ':app'
        EOF

    # --- 2. PASTIIN BUILD.GRADLE DI FOLDER APP BENER ---
    - name: Fix build.gradle di folder app
      run: |
        cd noir-parental/child-app-android
        
        # Kalau file app/build.gradle belum ada, bikin baru
        if [ ! -f app/build.gradle ]; then
          mkdir -p app
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application' version '8.6.1'
          }
          android {
              namespace 'com.noir.childapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.noir.childapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
        else
          # Kalau udah ada, cuma tambahin versi plugin-nya
          if ! grep -q "version '8.6.1'" app/build.gradle; then
            sed -i "s/id 'com.android.application'/id 'com.android.application' version '8.6.1'/" app/build.gradle
          fi
        fi

    # --- 3. BUILD ---
    - name: Build Debug APK
      run: |
        cd noir-parental/child-app-android
        ./gradlew assembleDebug

    # --- 4. CARI & UPLOAD ---
    - name: Tarik APK
      run: |
        find . -name "*.apk"
        find . -name "*.apk" -exec cp {} ./HASIL_APK.apk \;

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK-KAMU
        path: HASIL_APK.apk
