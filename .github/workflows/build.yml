name: Build APK Paling Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # PENTING: Kita nggak pakai working-directory lagi biar path-nya jelas
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # --- MASUK KE FOLDER & SETUP ---
    - name: Generate Gradle Wrapper & Settings
      run: |
        cd noir-parental/child-app-android
        gradle wrapper --gradle-version 9.8.2
        
        cat <<EOF > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = 'ChildApp'
        include ':app'
        EOF

    - name: Bikin build.gradle
      run: |
        cd noir-parental/child-app-android
        rm -f build.gradle
        mkdir -p app
        cat <<EOF > app/build.gradle
        plugins {
            id 'com.android.application' version '8.6.1'
        }
        android {
            namespace 'com.noir.childapp'
            compileSdk 34
            defaultConfig {
                applicationId "com.noir.childapp"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    - name: Bikin Manifest & Layout
      run: |
        cd noir-parental/child-app-android
        mkdir -p app/src/main/res/layout
        cat <<EOF > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application>
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        cat <<EOF > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:gravity="center">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Aplikasi Berhasil Di-build!" />
        </LinearLayout>
        EOF

    # --- BUILD ---
    - name: Build Debug APK
      run: |
        cd noir-parental/child-app-android
        ./gradlew assembleDebug

    # --- BRUTAL: CEK FOLDER ASLI & PRINT LOKASI ---
    - name: CEK FOLDER ASLI
      run: |
        echo "=== ISI FOLDER BUILD/OUTPUTS ==="
        ls -R noir-parental/child-app-android/app/build/outputs/ || echo "FOLDER NGGAK ADA!"
        
        echo "=== CARI FILE APK DI MANA AJA ==="
        find . -name "*.apk"

    # --- TARIK PAKSA KE ROOT REPO ---
    - name: TARIK PAKSA APK
      run: |
        # Cari file apk, pindahin ke paling luar repo
        find noir-parental/child-app-android -name "*.apk" -exec cp {} ./APK_ASLI_BANGET.apk \;
        
        # Cek apakah berhasil ditarik
        ls -la APK_ASLI_BANGET.apk

    # --- UPLOAD ---
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK-BANGET
        path: APK_ASLI_BANGET.apk
